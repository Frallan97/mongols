app:
  replicaCount: 1

  image:
    repository: ghcr.io/frallan97/mongols
    tag: latest
    # Always, because ArgoCD Image Updater rewrites the tag to a concrete
    # digest-backed version on each build; the deployment must not serve a
    # cached `latest` from the node.
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80

  # nginx serving a handful of static files. The bundle is ~800KB and is read
  # straight off the image layer, so this is deliberately small.
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

ingress:
  enabled: true
  className: traefik
  host: mongols.vibeoholic.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: mongols-tls

imagePullSecrets:
  - name: ghcr-pull-secret
