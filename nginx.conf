#
# A note on why the security headers are repeated in every location block.
#
# nginx's `add_header` does not accumulate down the config tree: a block that
# declares *any* add_header discards every add_header inherited from its
# parent. So putting the security headers at server level and a Cache-Control
# inside `location /` silently serves the site with no CSP and no
# X-Frame-Options at all — which is exactly what the first version of this
# file did, and it returns 200 either way, so nothing complains.
#
# Keeping them in a separate file and `include`-ing it is the usual fix; with
# three locations it is less indirection to repeat them.
#
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Vite fingerprints every asset filename, so these can be cached forever.
    # Most of the payload is the basemap topology compiled into the JS bundle;
    # it never changes between deploys of the same build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.(svg|png|ico|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Single page app: the year lives in the URL fragment, which never reaches
    # the server, so every path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Everything is bundled and self-contained — no external scripts,
        # fonts, map tiles or analytics — so the policy can be this tight.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
